name: Unix IPC

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix-ipc:
    runs-on: boat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.3'
      - name: Read pinned compiler
        id: compiler
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          configuration = pathlib.Path("rust-toolchain.toml").read_text()
          channel = tomllib.loads(configuration)["toolchain"]["channel"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"channel={channel}\n")
          PY
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: rustfmt, clippy
      - name: Test opt-in hook fixtures
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_pre_push.py -v
      - name: Test CLI audit process ownership
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_cli_ux*.py' -v
      - name: Test local security and transport
        shell: bash
        run: bash scripts/test_unix_ipc.sh
